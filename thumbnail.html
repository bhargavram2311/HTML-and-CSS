<!DOCTYPE html>
 <html >
    <head>
        <meta >
        <title>Thumbnail Image Gallery</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
            }
            .gallery  {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                margin-top: 20px;            
            }
.gallery_a_img {
width: 100px;
height: 100px;
object-fit: cover;
border: 2px solid #ccc;
border-radius: 8px;
transition: transform 0.3s;
}
</style>
</head>
<body>
<h1>My Image Gallery</h1>
<p>Click on a thumbnail to view the full-Sized image</p>

<div class="gallery">
<a href="bhargav.jpg" target="_blank">
<img src="bhargav.jpg" class="gallery_a_img" alt="Image 1">
</a>
<a href="manish.jpg" target="_blank">
<img src="manish.jpg" class="gallery_a_img" alt="Image 2">
</a>
<a href="sarath.jpg" target="_blank">
<img src="sarath.jpg" class="gallery_a_img" alt="Image 3">
</a>
</div>

</body>
</html>


    </html>
