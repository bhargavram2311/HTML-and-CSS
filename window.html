<!DOCTYPE html>
<html>
    <head>
        <title>Window Object Example</title>
    </head>
    <body>
        <h1>Windo Object Demo</h1>
        <button onclick="showWindowInfo()">Show Window Info</button>
        <button onclick="openNewWindow()">Open New Window</button>
        <button onclick="closeNewWindow()">Close New Window</button>
        <div id="output"></div>
        <script>
            let newWin;
            function showWindowInfo()
            {
                let width = window.innerWidth;
                let height = window.innerHeight;
                let locationHref= window.location.href;
                document.getElementById("output").innerHTML="Window Width:"+width+"px<br>"+"Window Height:"+height+"px<br>"+"Current URL:"+locationHref;
            }
            
        </script>
    </body>
</html>
